<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 1 - Таблиця</title>
</head>
<body>
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center;">
    <h1>Завдання 1: Симетрична кольорова таблиця</h1>

    <table border="1" style="border-collapse: collapse; border: 2px solid #000; width: 450px; height: 450px; text-align: center;">

      <tr style="height: 40px;">
        <td colspan="7" style="background-color: #00e5ff;"></td>
      </tr>
      <tr style="height: 30px;">
        <td rowspan="5" style="background-color: #00e5ff; width: 30px;"></td>
        <td colspan="5" style="background-color: #1de9b6;"></td>
        <td rowspan="5" style="background-color: #00e5ff; width: 30px;"></td>
      </tr>
      <tr style="height: 30px;">
        <td rowspan="3" style="background-color: #ffff8d; width: 40px;"></td>
        <td colspan="3" style="background-color: #80d8ff;"></td>
        <td rowspan="3" style="background-color: #ffff8d; width: 40px;"></td>
      </tr>
      <tr>
        <td style="background-color: #ff1744; width: 60px; height: 60px;"></td>
        <td style="background-color: #2979ff; width: 60px; height: 60px;"></td>
      </tr>
      <tr>
        <td style="background-color: #76ff03; width: 60px; height: 60px;"></td>
        <td style="background-color: #ffea00; width: 60px; height: 60px;"></td>
      </tr>
      <tr style="height: 30px;">
        <td colspan="5" style="background-color: #1de9b6;"></td>
      </tr>
      <tr style="height: 40px;">
        <td colspan="7" style="background-color: #00e5ff;"></td>
      </tr>
    </table>

    <br>
    <p><a href="../index.html" style="font-size: 16px;">Повернутись на головну</a></p>
  </div>
</body>
</html>
