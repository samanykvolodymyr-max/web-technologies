<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна 6 - Завдання 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="widget">
        <div class="card">
            <span class="temp">17</span>
        </div>

        <div class="cloud"></div>

        <div class="arrows">
            <span class="arrow">&larr;</span>
            <span class="arrow arrow-next">&rarr;</span>
        </div>

        <ul class="forecast">
            <li class="day"><span class="day-name">Mon</span><span class="day-temp">17&deg;</span></li>
            <li class="day"><span class="day-name">Tue</span><span class="day-temp">19&deg;</span></li>
            <li class="day"><span class="day-name">Wed</span><span class="day-temp">16&deg;</span></li>
            <li class="day"><span class="day-name">Thu</span><span class="day-temp">18&deg;</span></li>
            <li class="day"><span class="day-name">Fri</span><span class="day-temp">21&deg;</span></li>
        </ul>
    </div>
</body>
</html>
