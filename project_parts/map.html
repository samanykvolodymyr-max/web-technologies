<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завдання 5 - Інтерактивна карта</title>
  <!-- Підключення CSS Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333333;
    }
    p {
      color: #555555;
      line-height: 1.6;
    }
    #map {
      height: 400px;
      width: 100%;
      border-radius: 8px;
      margin: 20px 0;
      border: 1px solid #ccc;
    }
    .nav-link {
      text-align: center;
      margin-top: 20px;
    }
    .nav-link a {
      color: #0275d8;
      text-decoration: none;
      font-weight: bold;
    }
    .nav-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Завдання 5: Інтерактивна карта</h1>
    <p>На цій сторінці розміщено інтерактивну карту з позначкою 8-го корпусу ЧНУ ім. Юрія Федьковича (вул. Сторожинецька, 101).</p>

    <!-- Контейнер для карти Leaflet -->
    <div id="map"></div>

    <!-- Альтернативний перегляд через iframe OpenStreetMap -->
    <h3>Альтернативний перегляд (Iframe OSM)</h3>
    <iframe 
      width="100%" 
      height="300" 
      frameborder="0" 
      scrolling="no" 
      marginheight="0" 
      marginwidth="0" 
      src="https://www.openstreetmap.org/export/embed.html?bbox=25.9100%2C48.2650%2C25.9350%2C48.2780&amp;layer=mapnik&amp;marker=48.2718%2C25.9221"
      style="border: 1px solid #ccc; border-radius: 8px;">
    </iframe>

    <div class="nav-link">
      <a href="../index.html">← Повернутись на головну</a>
    </div>
  </div>

  <!-- Підключення JS Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Координати 8-го корпусу ЧНУ (вул. Сторожинецька, 101, Чернівці)
    const lat = 48.2718;
    const lng = 25.9221;
    const map = L.map('map').setView([lat, lng], 16);

    // Використовуємо надійний безкоштовний сервер тайлів Esri World Street Map (без API key та без 403)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom'
    }).addTo(map);

    // Додавання маркера з підказкою
    const marker = L.marker([lat, lng]).addTo(map);
    marker.bindPopup("<b>ЧНУ ім. Юрія Федьковича</b><br>8-й корпус (вул. Сторожинецька, 101)").openPopup();
  </script>
</body>
</html>
